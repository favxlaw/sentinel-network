user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $host [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  keepalive_timeout  65;

  # Rate limiting zones per tenant
  limit_req_zone $binary_remote_addr zone=dao_alpha:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=dao_beta:10m rate=50r/m;
  limit_req_zone $binary_remote_addr zone=dao_gamma:10m rate=200r/m;

  upstream aggregator_upstream {
    server 10.0.10.20:8000;
  }

  # Default server to catch non-matching hosts
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 443 ssl;
    server_name alpha.sentinel.local;

    ssl_certificate     /etc/nginx/ssl/sentinel.crt;
    ssl_certificate_key /etc/nginx/ssl/sentinel.key;

    limit_req zone=dao_alpha burst=20 nodelay;
    error_page 429 /errors/429-dao-alpha.html;

    location /errors/ {
      root /etc/nginx;
      internal;
    }

    location / {
      proxy_pass http://aggregator_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 443 ssl;
    server_name beta.sentinel.local;

    ssl_certificate     /etc/nginx/ssl/sentinel.crt;
    ssl_certificate_key /etc/nginx/ssl/sentinel.key;

    limit_req zone=dao_beta burst=10 nodelay;
    error_page 429 /errors/429-dao-beta.html;

    location /errors/ {
      root /etc/nginx;
      internal;
    }

    location / {
      proxy_pass http://aggregator_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 443 ssl;
    server_name gamma.sentinel.local;

    ssl_certificate     /etc/nginx/ssl/sentinel.crt;
    ssl_certificate_key /etc/nginx/ssl/sentinel.key;

    limit_req zone=dao_gamma burst=40 nodelay;
    error_page 429 /errors/429-dao-gamma.html;

    location /errors/ {
      root /etc/nginx;
      internal;
    }

    location / {
      proxy_pass http://aggregator_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
