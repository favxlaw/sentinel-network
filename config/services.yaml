# Sentinel Network - Service Configuration
# All values are configurable; environment variables can override placeholders.

global:
  environment: production
  log_level: INFO
  repo_root: /opt/sentinel/sentinel-network
  data_dir: /data/sentinel

paths:
  tenant_config: ${TENANT_CONFIG_PATH}
  watcher_db: ${SENTINEL_DB_PATH}

blockchain_proxy:
  server:
    host: 0.0.0.0
    port: 8545
  upstream_rpc:
    # Prefer explicit URL; if empty, provider+api_key will be used by the service.
    url: ${UPSTREAM_RPC_URL}
    provider: ${RPC_PROVIDER}
    alchemy_api_key: ${ALCHEMY_API_KEY}
    infura_api_key: ${INFURA_API_KEY}
    request_timeout_seconds: 10
    max_retries: 3
  cache:
    backend: memory
    ttl_seconds: 300
    redis_url: ${REDIS_URL}
  logging:
    dir: /opt/sentinel/sentinel-network/blockchain-proxy/logs

watcher:
  poll_interval_seconds: 12
  rpc_url: http://127.0.0.1:8545/rpc
  ipfs_api_url: http://127.0.0.1:5001
  db_path: /data/sentinel/watcher.db
  tenant_config_path: /opt/sentinel/sentinel-network/config/tenants.yaml
  log_dir: /opt/sentinel/sentinel-network/watcher-service/logs

aggregator:
  host: 0.0.0.0
  port: 8000
  db_path: /data/sentinel/watcher.db
  tenant_config_path: /opt/sentinel/sentinel-network/config/tenants.yaml
  ipfs_api_url: http://127.0.0.1:5001
  log_level: INFO
  environment: production

ipfs:
  api_url: http://127.0.0.1:5001
  swarm_key_path: /opt/sentinel/sentinel-network/ipfs/swarm.key
  data_dir: /data/ipfs
  compose_file: /opt/sentinel/sentinel-network/ipfs/docker-compose.yml
