services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: sentinel-ipfs-local
    ports:
      - "127.0.0.1:5002:5001"  
      - "127.0.0.1:8081:8080"  
    volumes:
      - ./data:/data/ipfs
    environment:
      IPFS_PROFILE: server
    command: daemon --migrate=true
    restart: unless-stopped
